[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechsound"
version = "0.1.0"
description = "Play mechanical keyboard sounds for every key you press, system-wide."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "Pillow>=9",
    "pygame>=2.5",
    "pynput>=1.7",
    "pystray>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mechsound = "mechsound.cli:main"

# A GUI script gets no console window on Windows.
[project.gui-scripts]
mechsound-tray = "mechsound.tray:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
